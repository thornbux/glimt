<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 946" width="1200" height="946" role="img" aria-label="How Glimt changes a file on disk safely. An action passes are_free_to_change, which refuses while other work touches the same files. The job runs in its own thread and changes the disk only through one function per kind of change: trash, put_file, rename_never_over, replace_existing and replace_name, each writing whole under a hidden temporary name and renaming, never over another file. The result comes back as an OperationReport: the list, marks, stars and collection entries follow, and Undo is kept; Rename Many's journal puts names right after a crash.">
  <title>A change on disk, safely</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="946" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#1f2328">
    <text x="20" y="34" font-size="20" font-weight="700">A change on disk, safely</text>
    <text x="20" y="56" font-size="13" fill="#57606a">Five operations from the menu down to the disk. Each column is one operation; the layers are the same for all of them.</text>

    <!-- 1. Actions -->
    <g font-size="13" font-weight="700" text-anchor="middle">
      <rect x="30" y="76" width="220" height="34" rx="17" fill="#fef3e2" stroke="#d08a1a" stroke-width="1.5"/>
      <text x="140" y="98">Delete (Trash or for good)</text>
      <rect x="260" y="76" width="220" height="34" rx="17" fill="#fef3e2" stroke="#d08a1a" stroke-width="1.5"/>
      <text x="370" y="98">Move or Copy</text>
      <rect x="490" y="76" width="220" height="34" rx="17" fill="#fef3e2" stroke="#d08a1a" stroke-width="1.5"/>
      <text x="600" y="98">Rename Many</text>
      <rect x="720" y="76" width="220" height="34" rx="17" fill="#fef3e2" stroke="#d08a1a" stroke-width="1.5"/>
      <text x="830" y="98">Save a turn</text>
      <rect x="950" y="76" width="220" height="34" rx="17" fill="#fef3e2" stroke="#d08a1a" stroke-width="1.5"/>
      <text x="1060" y="98">Keywords, stars</text>
    </g>
    <g stroke="#1f2328" stroke-width="1.5">
      <line x1="140" y1="110" x2="140" y2="138" marker-end="url(#arrow)"/>
      <line x1="370" y1="110" x2="370" y2="138" marker-end="url(#arrow)"/>
      <line x1="600" y1="110" x2="600" y2="138" marker-end="url(#arrow)"/>
      <line x1="830" y1="110" x2="830" y2="138" marker-end="url(#arrow)"/>
      <line x1="1060" y1="110" x2="1060" y2="138" marker-end="url(#arrow)"/>
    </g>

    <!-- 2. The gate -->
    <rect x="30" y="140" width="1140" height="150" rx="6" fill="#f1f1e4" stroke="#7a7a2a" stroke-width="1.5"/>
    <text x="44" y="162" font-size="14" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">start_job · run_in_background → are_free_to_change(paths)</tspan>   <tspan font-weight="400" font-size="12" fill="#57606a">files/file_ops.rs, on the UI thread</tspan></text>
    <g font-size="12">
      <text x="44" y="184">Refuses the operation while other work could cross it:</text>
      <text x="56" y="202">• a turn of one of these files is still being saved (file_operations.saving)</text>
      <text x="56" y="218">• keywords or stars are being written (a sidecars job still alive)</text>
      <text x="56" y="234">• Rename Many runs (file_operations.renaming), or the list's names are not yet checked</text>
      <text x="56" y="250">• a running job or held work touches a path, a folder above it, or a file in it (is_changed_by_running_work)</text>
      <text x="44" y="276">Passed: an Arc&lt;Job&gt; with progress and Stop, in file_operations.jobs and the status bar. Save a turn asks is_changed_by_running_work itself; keywords are never refused.</text>
    </g>
    <rect x="890" y="172" width="266" height="70" rx="6" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="902" y="192" font-size="12" font-weight="700" fill="#9b2c20">Refused: a notice, nothing done</text>
    <text x="902" y="210" font-size="12">“Still working on these files:</text>
    <text x="902" y="226" font-size="12">try again in a moment”</text>
    <line x1="700" y1="207" x2="888" y2="207" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-red)"/>

    <g stroke="#1f2328" stroke-width="1.5">
      <line x1="140" y1="290" x2="140" y2="326" marker-end="url(#arrow)"/>
      <line x1="370" y1="290" x2="370" y2="326" marker-end="url(#arrow)"/>
      <line x1="600" y1="290" x2="600" y2="326" marker-end="url(#arrow)"/>
      <line x1="830" y1="290" x2="830" y2="326" marker-end="url(#arrow)"/>
      <line x1="1060" y1="290" x2="1060" y2="326" marker-end="url(#arrow)"/>
    </g>
    <text x="150" y="314" font-size="12" fill="#57606a">thread::spawn</text>

    <!-- 3. The job threads -->
    <g font-size="12">
      <rect x="30" y="328" width="220" height="132" rx="6" fill="#ffffff" stroke="#7a7a2a" stroke-width="1.5"/>
      <text x="42" y="349" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">delete_now</text>
      <text x="42" y="369">in chunks of 100, Stop between;</text>
      <text x="42" y="385">xmp::lock_sidecars locks the sidecars;</text>
      <text x="42" y="401">trash::trash, or remove_file</text>
      <text x="42" y="417">for good; the sidecars go the</text>
      <text x="42" y="433">same way</text>

      <rect x="260" y="328" width="220" height="132" rx="6" fill="#ffffff" stroke="#7a7a2a" stroke-width="1.5"/>
      <text x="272" y="349" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">transfer</text>
      <text x="272" y="369">per file, xmp::held on a move;</text>
      <text x="272" y="385" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">put_file(from, to, keep)</text>
      <text x="272" y="401">then xmp::follow moves or</text>
      <text x="272" y="417">copies the sidecar after it</text>

      <rect x="490" y="328" width="220" height="132" rx="6" fill="#ffffff" stroke="#7a7a2a" stroke-width="1.5"/>
      <text x="502" y="349" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">rename_files</text>
      <text x="502" y="369">journal::begin: the plan on</text>
      <text x="502" y="385">disk, locked, before a rename;</text>
      <text x="502" y="401">journal::step for each one;</text>
      <text x="502" y="417">a failure: journal::undo puts</text>
      <text x="502" y="433">every name back</text>

      <rect x="720" y="328" width="220" height="132" rx="6" fill="#ffffff" stroke="#7a7a2a" stroke-width="1.5"/>
      <text x="732" y="349" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">save_orientation</text>
      <text x="732" y="369">JPEG: exif::write_orientation</text>
      <text x="732" y="385">PNG, WebP: save_rotated</text>
      <text x="732" y="401">both end in</text>
      <text x="732" y="417" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">replace_with_sidecar</text>
      <text x="732" y="433">with Derived::Oriented or Turned</text>

      <rect x="950" y="328" width="220" height="132" rx="6" fill="#ffffff" stroke="#7a7a2a" stroke-width="1.5"/>
      <text x="962" y="349" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">write_sidecars</text>
      <text x="962" y="369">one sidecar_writer thread, so</text>
      <text x="962" y="385">changes land in the order made;</text>
      <text x="962" y="401">xmp::update_sidecar under the</text>
      <text x="962" y="417">sidecar's lock (stars too,</text>
      <text x="962" y="433">marks::write_xmp)</text>
    </g>

    <g stroke="#1f2328" stroke-width="1.5">
      <line x1="140" y1="460" x2="140" y2="512" marker-end="url(#arrow)"/>
      <line x1="370" y1="460" x2="370" y2="512" marker-end="url(#arrow)"/>
      <line x1="600" y1="460" x2="440" y2="512" marker-end="url(#arrow)"/>
      <line x1="830" y1="460" x2="830" y2="512" marker-end="url(#arrow)"/>
      <line x1="1060" y1="460" x2="1060" y2="512" marker-end="url(#arrow)"/>
    </g>
    <text x="528" y="492" font-size="12" fill="#57606a">journal::step</text>

    <!-- 4. The one function per change -->
    <g font-size="12">
      <rect x="30" y="514" width="220" height="138" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
      <text x="42" y="535" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">trash::trash</text>
      <text x="42" y="555">gio trash, one call per chunk,</text>
      <text x="42" y="571">within a time limit;</text>
      <text x="42" y="587">in a Flatpak, a file the portal</text>
      <text x="42" y="603">refuses goes by hand, as the</text>
      <text x="42" y="619">trash spec says (trash_by_hand)</text>
      <text x="42" y="641" fill="#57606a">files/trash.rs</text>

      <rect x="260" y="514" width="220" height="138" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
      <text x="272" y="535" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">put_file</text>
      <text x="272" y="555">copy: under a hidden name,</text>
      <text x="272" y="571">0600, synced, then renamed;</text>
      <text x="272" y="587">move: a rename; to another</text>
      <text x="272" y="603">disk, a copy and an unlink</text>
      <text x="272" y="641" fill="#57606a">files/file_io.rs</text>

      <rect x="490" y="514" width="220" height="138" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
      <text x="502" y="535" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">rename_never_over</text>
      <text x="502" y="555">renameat2 with</text>
      <text x="502" y="571">RENAME_NOREPLACE; where the</text>
      <text x="502" y="587">disk cannot, a hard link and</text>
      <text x="502" y="603">an unlink: never over a file</text>
      <text x="502" y="619">another window just put there</text>
      <text x="502" y="641" fill="#57606a">files/file_io.rs</text>

      <rect x="720" y="514" width="220" height="138" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
      <text x="732" y="535" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">replace_existing</text>
      <text x="732" y="555">check_writable(): read-only is</text>
      <text x="732" y="571">refused; the new image written</text>
      <text x="732" y="587">whole beside it; still there?</text>
      <text x="732" y="603">then the sidecar step, then</text>
      <text x="732" y="619">the rename over the old file</text>
      <text x="732" y="641" fill="#57606a">files/file_io.rs</text>

      <rect x="950" y="514" width="220" height="138" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
      <text x="962" y="535" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">replace_name</text>
      <text x="962" y="555">the sidecar written whole</text>
      <text x="962" y="571">beside it and renamed over</text>
      <text x="962" y="587">the name: a link there is</text>
      <text x="962" y="603">replaced, never followed to</text>
      <text x="962" y="619">the file it points at</text>
      <text x="962" y="641" fill="#57606a">files/file_io.rs</text>
    </g>
    <line x1="480" y1="583" x2="488" y2="583" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="30" y="662" width="1140" height="66" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="682" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">write_beside · tmp_path</tspan>: every file Glimt writes goes whole to .glimt-tmp-&lt;instance&gt;-&lt;n&gt; beside it, synced, then renamed: after a crash, the old file or the new, never half.</text>
    <text x="44" y="700" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">edit_shared</tspan>: the files the windows share (settings, marks, the keyword tree) are locked, read, changed and written as one step.</text>

    <text x="44" y="718" font-size="12">clippy.toml refuses the raw calls (std::fs::write, rename, copy, File::create …), so cargo clippy fails on a bypass; an exception carries #[allow] and its reason.</text>
    <!-- 5. Back in the window -->
    <text x="30" y="760" font-size="14" font-weight="700">Back in the window, Undo, and after a crash</text>
    <g font-size="12">
      <rect x="30" y="770" width="400" height="150" rx="6" fill="#fef3e2" stroke="#d08a1a" stroke-width="1.5"/>
      <text x="42" y="791" font-size="13" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">receive_operation_report</tspan>  <tspan font-weight="400" font-size="12" fill="#57606a">an OperationReport</tspan></text>
      <text x="42" y="813">files gone leave the list; moved ones take their new name</text>
      <text x="42" y="831">marks.forget, marks.follow_files: marks and stars go along</text>
      <text x="42" y="849">forget_in_collection: a collection's entry goes with it</text>
      <text x="42" y="867">after a failure the folder is read again instead</text>
      <text x="42" y="889">kept for Edit → Undo: Undo::Trash, Undo::Move,</text>
      <text x="42" y="905">or Undo::Rename</text>

      <rect x="445" y="770" width="360" height="150" rx="6" fill="#fef3e2" stroke="#d08a1a" stroke-width="1.5"/>
      <text x="457" y="791" font-size="13" font-weight="700">Edit → Undo <tspan font-weight="400" font-size="12" fill="#57606a">App::undo, in the background</tspan></text>
      <text x="457" y="813">Trash: trash::restore finds the files in the trash</text>
      <text x="457" y="829">folders and puts them and their sidecars back;</text>
      <text x="457" y="845">marks.restore gives back their marks and stars</text>
      <text x="457" y="867">Move: put_file back; Rename: rename_files_of back</text>
      <text x="457" y="883">to the old names. Each only where the file's</text>
      <text x="457" y="899">fingerprint still matches what was moved or renamed</text>

      <rect x="820" y="770" width="350" height="150" rx="6" fill="#fef3e2" stroke="#d08a1a" stroke-width="1.5"/>
      <text x="832" y="791" font-size="13" font-weight="700">Rename Many's journal <tspan font-weight="400" font-size="12" fill="#57606a">files/journal.rs</tspan></text>
      <text x="832" y="813">The plan stays on disk, locked, while it runs.</text>
      <text x="832" y="829">A crash halfway leaves it behind:</text>
      <text x="832" y="851">journal::interrupted finds it at the next start,</text>
      <text x="832" y="867">and a dialog puts the old names back</text>
      <text x="832" y="883">(journal::undo) or finishes (journal::finish).</text>
    </g>
  </g>
</svg>
