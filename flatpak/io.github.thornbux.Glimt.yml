# Flatpak, built from this checkout:
#   flatpak-builder --user --install --install-deps-from=flathub --force-clean \
#       build-flatpak flatpak/io.github.thornbux.Glimt.yml
# The release workflow makes a bundle of it. Cargo fetches the crates during the build, so it
# needs the network; fine locally and in the workflow, not on Flathub. ffmpeg, zenity and gio
# run on the host through flatpak-spawn, so the sandbox is loose.
id: io.github.thornbux.Glimt
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: glimt
rename-desktop-file: glimt.desktop
rename-icon: glimt
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  - --filesystem=xdg-run/gvfs
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: glimt
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/glimt/cargo
    build-commands:
      - cargo build --release --locked --features full
      - install -Dm755 target/release/glimt /app/bin/glimt
      - install -Dm644 assets/glimt.desktop /app/share/applications/glimt.desktop
      - install -Dm644 assets/glimt.svg /app/share/icons/hicolor/scalable/apps/glimt.svg
      - install -Dm644 assets/glimt-256.png /app/share/icons/hicolor/256x256/apps/glimt.png
      - install -Dm644 docs/glimt.1 /app/share/man/man1/glimt.1
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - demo
          - build-flatpak
          - .flatpak-builder
