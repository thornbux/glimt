# Flatpak, built from this checkout:
#   flatpak-builder --user --install --install-deps-from=flathub --force-clean \
#       build-flatpak flatpak/io.github.thornbux.Glimt.yml
# The release workflow makes a bundle of it. The crates come from cargo-sources.json (made by
# tools/flatpak-sources.py from Cargo.lock), so the build needs no network, as on Flathub.
# Glimt's own programs (ffmpeg, zenity, gio, gdbus, sqlite3) are the runtime's, in the sandbox;
# GTK and gio use the desktop portals there. The user's own (plugins, decoders, a player, Open
# With's applications) run on the host only after
#   flatpak override --user --talk-name=org.freedesktop.Flatpak io.github.thornbux.Glimt
# The whole file system, as an image viewer's (Geeqie's on Flathub too): any folder, sidecars
# beside the photos, and the thumbnails shared with the file manager.
id: io.github.thornbux.Glimt
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: glimt
rename-desktop-file: glimt.desktop
rename-icon: glimt
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  - --filesystem=xdg-run/gvfs
  # The screen's colour profile.
  - --system-talk-name=org.freedesktop.ColorManager
modules:
  - name: glimt
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/glimt/cargo
    build-commands:
      - cargo build --release --offline --locked --features full
      - install -Dm755 target/release/glimt /app/bin/glimt
      - install -Dm644 assets/glimt.desktop /app/share/applications/glimt.desktop
      # Its launchable is renamed with the desktop file.
      - install -Dm644 -t /app/share/metainfo assets/io.github.thornbux.Glimt.metainfo.xml
      - install -Dm644 assets/glimt.svg /app/share/icons/hicolor/scalable/apps/glimt.svg
      - install -Dm644 assets/glimt-256.png /app/share/icons/hicolor/256x256/apps/glimt.png
      - install -Dm644 docs/glimt.1 /app/share/man/man1/glimt.1
      # MIT asks for the text, and the fonts and crates built into the binary have their own.
      - install -Dm644 -t /app/share/licenses/io.github.thornbux.Glimt LICENSE assets/fonts/LICENSE-Inter.txt assets/fonts/LICENSE-Phosphor.txt THIRD-PARTY-LICENSES.txt
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - demo
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
