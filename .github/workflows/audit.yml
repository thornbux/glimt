# Known vulnerabilities in the crates Glimt uses (RustSec), every Monday and when Cargo.lock
# changes: the release workflow checks too, but a crate found vulnerable between releases
# should not wait for the next one. Warnings (an unmaintained crate) do not fail it.
name: Audit

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths: [Cargo.lock]
  pull_request:
    paths: [Cargo.lock]
  workflow_dispatch:

# Reads the code only; actions from others are pinned to a commit, as in release.yml.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - run: cargo audit
