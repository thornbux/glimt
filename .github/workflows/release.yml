# Build and publish a release when a tag vX.Y.Z is pushed (or by hand, for an existing tag):
# a portable binary linked against glibc 2.28 with every feature, as a tar.gz, a .deb and an .rpm,
# and the version's section of CHANGELOG.md as the release notes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, for example v0.9.1
        required: true

# Actions from others are pinned to a commit: a tag can be moved to other code, and this job
# can write releases.
permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-gnu
  GLIBC: "2.28"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Version from the tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: System libraries for the window (Wayland, X11, OpenGL)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm,cargo-audit
      - name: Known vulnerabilities in the crates (RustSec)
        run: cargo audit
      - name: Build against glibc ${{ env.GLIBC }}
        run: cargo zigbuild --release --locked --features full --target "$TARGET.$GLIBC"
      - name: Check the glibc it needs
        run: |
          need=$(objdump -T "target/$TARGET/release/glimt" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Needs $need"
          test "$(printf '%s\n' "GLIBC_$GLIBC" "$need" | sort -V | tail -1)" = "GLIBC_$GLIBC"
      - name: tar.gz
        run: |
          dir="glimt-$VERSION-x86_64-linux"
          mkdir -p "$dir"
          cp "target/$TARGET/release/glimt" assets/glimt.desktop assets/glimt.svg assets/glimt-256.png \
             docs/glimt.1 LICENSE README.md CHANGELOG.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - name: .deb
        run: cargo deb --no-build --target "$TARGET" -o "glimt_${VERSION}_amd64.deb"
      - name: .rpm
        run: cargo generate-rpm --target "$TARGET" -o "glimt-${VERSION}-1.x86_64.rpm"
      - name: Release notes from CHANGELOG.md
        run: awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          name: Glimt ${{ env.VERSION }}
          body_path: notes.md
          files: |
            glimt-${{ env.VERSION }}-x86_64-linux.tar.gz
            glimt_${{ env.VERSION }}_amd64.deb
            glimt-${{ env.VERSION }}-1.x86_64.rpm
