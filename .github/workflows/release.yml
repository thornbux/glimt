# Build and publish a release when a tag vX.Y.Z is pushed (or by hand, for an existing tag):
# a portable binary linked against glibc 2.28 with every feature, as a tar.gz, a .deb, an .rpm
# and an AppImage, a Flatpak bundle, and the version's section of CHANGELOG.md as the release
# notes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, for example v0.9.1
        required: true

# Actions from others are pinned to a commit: a tag can be moved to other code. Only the jobs
# that publish get a token that can write releases or sign provenance, and they build nothing;
# the jobs that build, where the crates' build scripts run, can only read, and their checkouts
# keep no token on disk.
permissions:
  contents: read

env:
  TARGET: x86_64-unknown-linux-gnu
  GLIBC: "2.28"
  # Through the environment, never pasted into a script: a tag name may hold $( ) and quotes.
  TAG_GIVEN: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          # The history of main too, to see that the tag is on it.
          fetch-depth: 0
      - name: Version from the tag
        # A tag without the version in Cargo.toml would publish packages named for one version
        # holding another, and one without a CHANGELOG section empty release notes.
        run: |
          TAG="$TAG_GIVEN"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is no vX.Y.Z"; exit 1; }
          VERSION="${TAG#v}"
          grep -qx "version = \"$VERSION\"" Cargo.toml ||
            { echo "::error::Cargo.toml is not at version $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md ||
            { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          grep -q "\"Glimt $VERSION\"" docs/glimt.1 ||
            { echo "::error::docs/glimt.1 is not at version $VERSION"; exit 1; }
          # Software centres show the version and its date from here.
          grep -q "<release version=\"$VERSION\"" assets/io.github.thornbux.Glimt.metainfo.xml ||
            { echo "::error::the metainfo file has no release $VERSION"; exit 1; }
          # Only what is on main is published: not a tag on a branch never merged.
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: System libraries for the window (Wayland, X11, OpenGL)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10-09
        with:
          toolchain: stable
      - name: Zig 0.14.1, for cargo-zigbuild
        run: |
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          echo "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  zig.tar.xz" | sha256sum -c
          tar xJf zig.tar.xz && rm zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm,cargo-audit
      - name: Known vulnerabilities in the crates (RustSec)
        run: cargo audit
      # The tagged code itself, with the toolchain of this day: a tag pushed by hand, or a
      # crate changed since the last CI run, is not published untested.
      - name: Tests
        # The packages are built with every feature; a build from source has none: both.
        run: |
          cargo test --locked --release --features full
          cargo check --locked --release
      - name: Build against glibc ${{ env.GLIBC }}
        # Zig's linker says it ignores the -O1 that rustc gives it; nothing else is wrong.
        env:
          RUSTFLAGS: -A linker-messages
        run: cargo zigbuild --release --locked --features full --target "$TARGET.$GLIBC"
      - name: Check the glibc it needs
        run: |
          need=$(objdump -T "target/$TARGET/release/glimt" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Needs $need"
          test "$(printf '%s\n' "GLIBC_$GLIBC" "$need" | sort -V | tail -1)" = "GLIBC_$GLIBC"
      - name: tar.gz
        run: |
          dir="glimt-$VERSION-x86_64-linux"
          mkdir -p "$dir"
          cp "target/$TARGET/release/glimt" assets/glimt.desktop assets/glimt.svg assets/glimt-256.png \
             assets/io.github.thornbux.Glimt.metainfo.xml \
             docs/glimt.1 LICENSE README.md CHANGELOG.md assets/fonts/LICENSE-*.txt \
             THIRD-PARTY-LICENSES.txt "$dir/"
          cp -r examples "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - name: AppImage
        # The same binary, which loads OpenGL, Wayland and X11 from the system as it starts, so
        # nothing else goes in. appimagetool and the runtime (which needs no libfuse2) are
        # pinned releases; appimagetool runs extracted, as the runner has no FUSE.
        run: |
          curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -sSfL -o runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c <<'EOF'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime
          EOF
          chmod +x appimagetool
          app=Glimt.AppDir
          install -Dm755 "target/$TARGET/release/glimt" "$app/usr/bin/glimt"
          install -Dm644 assets/glimt.desktop "$app/usr/share/applications/glimt.desktop"
          install -Dm644 -t "$app/usr/share/metainfo" assets/io.github.thornbux.Glimt.metainfo.xml
          install -Dm644 assets/glimt.svg "$app/usr/share/icons/hicolor/scalable/apps/glimt.svg"
          install -Dm644 assets/glimt-256.png "$app/usr/share/icons/hicolor/256x256/apps/glimt.png"
          install -Dm644 docs/glimt.1 "$app/usr/share/man/man1/glimt.1"
          install -Dm644 -t "$app/usr/share/doc/glimt" LICENSE assets/fonts/LICENSE-*.txt \
            THIRD-PARTY-LICENSES.txt
          cp assets/glimt.desktop assets/glimt.svg "$app/"
          cp assets/glimt-256.png "$app/.DirIcon"
          ln -s usr/bin/glimt "$app/AppRun"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --runtime-file runtime \
              "$app" "glimt-$VERSION-x86_64.AppImage"
      - name: .deb
        run: cargo deb --no-build --target "$TARGET" -o "glimt_${VERSION}_amd64.deb"
      - name: .rpm
        run: cargo generate-rpm --target "$TARGET" -o "glimt-${VERSION}-1.x86_64.rpm"
      - name: Release notes from CHANGELOG.md
        run: awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            glimt-*-x86_64-linux.tar.gz
            glimt_*_amd64.deb
            glimt-*-1.x86_64.rpm
            glimt-*-x86_64.AppImage
            notes.md

  # Checksums, provenance and publishing, apart from the build: the signing token is never
  # where the crates' code runs.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance: a signed statement that this workflow built the files.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - name: Checksums
        run: |
          TAG="$TAG_GIVEN"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          sha256sum glimt-*-x86_64-linux.tar.gz glimt_*_amd64.deb glimt-*-1.x86_64.rpm \
              glimt-*-x86_64.AppImage > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            glimt-*-x86_64-linux.tar.gz
            glimt_*_amd64.deb
            glimt-*-1.x86_64.rpm
            glimt-*-x86_64.AppImage
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="glimt-$VERSION-x86_64-linux.tar.gz glimt_${VERSION}_amd64.deb glimt-$VERSION-1.x86_64.rpm
                 glimt-$VERSION-x86_64.AppImage SHA256SUMS"
          # Run again by hand for a tag with a release already: replace its files.
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Glimt $VERSION" \
              --notes-file notes.md $files ||
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber $files

  # Built beside the release in Flathub's image, and added to it afterwards, so that a broken
  # Flatpak build does not hold back the other packages. The image is pinned by its digest, as
  # the actions are by their commits: a tag can be moved, and this one runs privileged and its
  # bundle is signed. A new runtime: its tag's digest from
  # `docker buildx imagetools inspect ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-XX.YY`.
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Build the bundle
        run: |
          TAG="$TAG_GIVEN"
          flatpak-builder --install-deps-from=flathub --disable-rofiles-fuse --force-clean --repo=repo \
              build flatpak/io.github.thornbux.Glimt.yml
          flatpak build-bundle repo "glimt-${TAG#v}-x86_64.flatpak" io.github.thornbux.Glimt \
              --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: glimt-*.flatpak

  flatpak-publish:
    needs: [release, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: glimt-*.flatpak
      - name: Add it to the release, and its checksum to SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$TAG_GIVEN"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS
          # Run again by hand: the old line goes.
          grep -v '\.flatpak$' SHA256SUMS > sums || true
          sha256sum glimt-*.flatpak >> sums
          mv sums SHA256SUMS
          gh release upload "$TAG" --clobber -R "$GITHUB_REPOSITORY" glimt-*.flatpak SHA256SUMS
