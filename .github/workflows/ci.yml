# Format, lint and test on every push and pull request: the same checks as AGENTS.md asks for
# before a commit, with and without the optional features.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Reads the code only; actions from others are pinned to a commit, as in release.yml.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.features == '' && 'default features' || matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--all-features"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries for the window (Wayland, X11, OpenGL)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.features }}
      - run: cargo fmt --check
      # --locked as the release builds: a Cargo.toml changed without its Cargo.lock fails here,
      # not on the tag.
      - run: cargo clippy --locked --release ${{ matrix.features }} -- -D warnings
      - run: cargo test --locked --release ${{ matrix.features }}
      # The SBOM in step with Cargo.lock, also after Dependabot changed it.
      - name: sbom.cdx.json up to date
        if: matrix.features == ''
        run: python3 tools/sbom.py && git diff --exit-code sbom.cdx.json THIRD-PARTY-LICENSES.txt
