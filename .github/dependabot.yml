# Dependabot proposes updates as pull requests: the crates once a week, and the actions the
# workflows pin to a commit, whose pins it moves to the new commit with its tag in a comment.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Taken only because image already has it: a version image does not use is a second
      # copy. Remove when image moves to moxcms 0.9.
      - dependency-name: moxcms
        versions: [">= 0.9"]
      # The same: in Cargo.toml for a feature of the version image or eframe already use, so a
      # minor or major step of their own would add a second copy. They move with image and eframe.
      - dependency-name: png
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: tiff
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: winit
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: arboard
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
