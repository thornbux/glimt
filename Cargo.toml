[package]
name = "glimt"
version = "0.38.0"
edition = "2024"
# The oldest Rust that builds it: egui's. Checked with the rust:1.95 image.
rust-version = "1.95"
license = "MIT"
authors = ["Hans-Henry Jakobsen"]
description = "Fast, lightweight image viewer for Linux, inspired by Geeqie"
repository = "https://github.com/thornbux/glimt"
readme = "README.md"
categories = ["multimedia::images"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fast_image_resize = { version = "6.1.0", default-features = false, features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "pnm", "bmp", "ico", "qoi", "hdr"] }
# JPEG decoded at 1/2, 1/4 or 1/8 of its size while decoding, when the window needs no more:
# a 12 MP photo for the window in 6 MB instead of 44 MB, and faster (image uses zune-jpeg).
jpeg-decoder = { version = "0.3", default-features = false }
# Already used by image; here for the text chunks of shared thumbnails (Thumb::URI, Thumb::MTime).
png = "0.18.1"
# Already used by image; here for ICC profiles.
moxcms = "0.8.1"
# Already used by eframe; here for copying files to the clipboard.
arboard = { version = "3.6.1", default-features = false }
# Already used by image; here for the pages of multi-page TIFFs.
tiff = { version = "0.11.3", default-features = false }
# Already used by eframe; here for the window frame on GNOME/Wayland, which shows the title.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
# Searches with re: and exif:re:.
regex = "1.13.1"
# Optional: JPEG XL (feature jxl).
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"], optional = true }
# Optional: SVG (feature svg).
resvg = { version = "0.48.1", optional = true }
# A .svgz unpacked with a limit, which usvg's own unpacking has not (already in through usvg).
flate2 = { version = "1.1.10", optional = true }

[features]
# Video previews via the ffmpeg program and playing in an external player.
video = []
# HEIC/HEIF photos (iPhone) via the ffmpeg program, 8.0 or newer.
heic = []
# AVIF photos via the ffmpeg program (dav1d).
avif = []
# JPEG XL photos, decoded in Rust by jxl-oxide.
jxl = ["dep:jxl-oxide"]
# SVG images, drawn in Rust by resvg.
svg = ["dep:resvg", "dep:flate2"]
# Geeqie's marks 1-6 and 0-5 stars, kept in ~/.local/state/glimt/marks.
marks = []
# Screen readers such as Orca, through AccessKit: the menus, buttons and lists, and the shown
# image as text (its name, place, stars, keywords and comment).
accessibility = ["eframe/accesskit"]
# Every optional feature: cargo build --release --features full (same as --all-features).
full = ["video", "heic", "avif", "jxl", "svg", "marks", "accessibility"]

# The .deb package (cargo deb), built by the release workflow.
[package.metadata.deb]
maintainer = "Hans-Henry Jakobsen <53930032+thornbux@users.noreply.github.com>"
copyright = "2026, Hans-Henry Jakobsen"
section = "graphics"
extended-description = """\
A fast, memory-frugal image viewer with Geeqie's keyboard shortcuts. It handles folders of any \
size, reads JPEG, PNG, WebP, GIF, TIFF, camera RAW, HEIC, AVIF, JPEG XL and SVG, and shares \
its thumbnails with the file manager."""
# Not "$auto": dpkg-shlibdeps rounds glibc up to 2.34, the binary needs 2.28. OpenGL and
# xkbcommon are loaded as the window opens, so no linker sees them: named here, as in Ubuntu
# 20.04 and Debian 10.
depends = "libc6 (>= 2.28), libegl1, libgl1, libxkbcommon0, libxkbcommon-x11-0"
license-file = ["LICENSE", "0"]
recommends = "ffmpeg, zenity, libglib2.0-bin, sqlite3"
assets = [
    ["target/release/glimt", "usr/bin/", "755"],
    ["assets/glimt.desktop", "usr/share/applications/", "644"],
    ["assets/io.github.thornbux.Glimt.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/glimt.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/glimt-256.png", "usr/share/icons/hicolor/256x256/apps/glimt.png", "644"],
    ["docs/glimt.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/glimt/", "644"],
    ["CHANGELOG.md", "usr/share/doc/glimt/", "644"],
    ["assets/fonts/LICENSE-Inter.txt", "usr/share/doc/glimt/", "644"],
    ["assets/fonts/LICENSE-Phosphor.txt", "usr/share/doc/glimt/", "644"],
    ["THIRD-PARTY-LICENSES.txt", "usr/share/doc/glimt/", "644"],
]

[package.metadata.generate-rpm]
# Its own list of libraries writes "[WEAK]" symbol versions that dnf cannot resolve.
auto-req = "no"
# As for the .deb, OpenGL (EGL) and xkbcommon, which the window loads as it opens; names as in
# RHEL 8.
requires = { glibc = ">= 2.28", libglvnd-egl = "*", libxkbcommon = "*", libxkbcommon-x11 = "*" }
assets = [
    { source = "target/release/glimt", dest = "/usr/bin/glimt", mode = "755" },
    { source = "assets/glimt.desktop", dest = "/usr/share/applications/glimt.desktop", mode = "644" },
    { source = "assets/io.github.thornbux.Glimt.metainfo.xml", dest = "/usr/share/metainfo/io.github.thornbux.Glimt.metainfo.xml", mode = "644" },
    { source = "assets/glimt.svg", dest = "/usr/share/icons/hicolor/scalable/apps/glimt.svg", mode = "644" },
    { source = "assets/glimt-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/glimt.png", mode = "644" },
    { source = "docs/glimt.1", dest = "/usr/share/man/man1/glimt.1", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/glimt/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/glimt/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/glimt/LICENSE", mode = "644" },
    { source = "assets/fonts/LICENSE-Inter.txt", dest = "/usr/share/licenses/glimt/LICENSE-Inter.txt", mode = "644" },
    { source = "assets/fonts/LICENSE-Phosphor.txt", dest = "/usr/share/licenses/glimt/LICENSE-Phosphor.txt", mode = "644" },
    { source = "THIRD-PARTY-LICENSES.txt", dest = "/usr/share/licenses/glimt/THIRD-PARTY-LICENSES.txt", mode = "644" },
]

# A file, so that Fedora's ffmpeg-free and RPM Fusion's ffmpeg both satisfy it.
[package.metadata.generate-rpm.recommends]
"/usr/bin/ffmpeg" = "*"
zenity = "*"
# For Import Lightroom Catalog; Fedora's package is sqlite.
"/usr/bin/sqlite3" = "*"
