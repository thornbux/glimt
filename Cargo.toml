[package]
name = "glimt"
version = "0.9.0"
edition = "2024"
license = "MIT"
authors = ["Hans-Henry Jakobsen"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fast_image_resize = { version = "6.1.0", default-features = false, features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "pnm"] }
png = "0.18.1"
# Already used by image; here for ICC profiles.
moxcms = "0.8.1"
# Already used by eframe; here for copying files to the clipboard.
arboard = { version = "3.6.1", default-features = false }
# Already used by image; here for the pages of multi-page TIFFs.
tiff = { version = "0.11.3", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
# Optional: JPEG XL (feature jxl).
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"], optional = true }
# Optional: SVG (feature svg).
resvg = { version = "0.48.1", optional = true }

[features]
# Video previews via the ffmpeg program and playing in an external player.
video = []
# HEIC/HEIF photos (iPhone) via the ffmpeg program, 8.0 or newer.
heic = []
# AVIF photos via the ffmpeg program (dav1d).
avif = []
# JPEG XL photos, decoded in Rust by jxl-oxide.
jxl = ["dep:jxl-oxide"]
# SVG images, drawn in Rust by resvg.
svg = ["dep:resvg"]
# Geeqie's marks 1-6 and 0-5 stars, kept in ~/.local/state/glimt/marks.
marks = []
# Every optional feature: cargo build --release --features full (same as --all-features).
full = ["video", "heic", "avif", "jxl", "svg", "marks"]
