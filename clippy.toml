# Glimt's rules for what touches the disk and starts programs, and how buttons and selectable
# rows are drawn, checked by `cargo clippy`. The one place that may do each has
# `#[allow(clippy::disallowed_methods)]` with its reason.
disallowed-methods = [
    { path = "std::fs::read", reason = "decode::read_limited: a size cap, and no pipe or device" },
    { path = "std::fs::read_to_string", reason = "decode::read_text: a size cap, and no pipe or device" },
    { path = "std::io::read_to_string", reason = "decode::read_text, or bound the reader with take" },
    { path = "std::io::Read::read_to_end", reason = "decode::read_limited, or bound the reader with take" },
    { path = "std::fs::write", reason = "file_io::replace_name (a file of the user's), create_file (a new one) or replace_file (Glimt's own only, through a link): whole or not at all" },
    { path = "std::fs::File::create", reason = "file_io::create_file or replace_name: never through a link, never half-written; replace_file only for Glimt's own files" },
    { path = "std::fs::File::create_new", reason = "file_io::create_file: never through a link, never half-written" },
    { path = "std::fs::OpenOptions::open", reason = "file_io's writers or decode::read_limited" },
    { path = "std::fs::rename", reason = "file_io::rename_never_over, or file_io::replace_name to replace (replace_file for Glimt's own files)" },
    { path = "std::fs::copy", reason = "file_io::put_file: never over a file, never half-copied" },
    { path = "std::process::Command::new", reason = "external::command (Glimt's own programs, in a Flatpak's sandbox) or host_command (the user's, on the host), or their stoppable_ forms" },
    { path = "std::process::Command::output", reason = "external::run_limited or limited: never wait for good" },
    { path = "std::process::Command::status", reason = "external::run_limited or limited: never wait for good" },
    { path = "std::fs::File::open", reason = "decode::open: no pipe or device, which would block or never end" },
    { path = "image::ImageReader::open", reason = "decode::image_reader: the image crate's own open lets a pipe or device through" },
    { path = "image::image_dimensions", reason = "decode::image_reader(path)?.into_dimensions(): the image crate's own open lets a pipe or device through" },
    { path = "image::DynamicImage::from_decoder", reason = "decode::from_decoder: the size limit first, as a header may claim gigabytes" },
    { path = "image::load_from_memory", reason = "decode::from_memory: `fits` first, as a header may claim gigabytes" },
    { path = "image::load_from_memory_with_format", reason = "decode::from_memory: `fits` first, as a header may claim gigabytes" },
    { path = "jpeg_decoder::Decoder::decode", reason = "decode::scaled: `fits` first, as jpeg-decoder has no limit of its own" },
    { path = "image::open", reason = "decode::from_decoder(decode::image_reader(path)?.into_decoder()?): no pipe or device, and `fits` first" },
    { path = "image::load", reason = "decode::from_decoder: `fits` first, as a header may claim gigabytes" },
    { path = "image::ImageReader::decode", reason = "decode::from_decoder(reader.into_decoder()?): `fits` first, as a header may claim gigabytes" },
    { path = "image::ImageReader::no_limits", reason = "decode::from_decoder: a decode keeps its limits, and `fits` first" },
    { path = "image::Limits::no_limits", reason = "decode::from_decoder: a decode keeps its limits, and `fits` first" },
    { path = "image::ImageDecoder::read_image", reason = "decode::from_decoder: `fits` first, as a header may claim gigabytes" },
    { path = "image::ImageDecoder::read_image_boxed", reason = "decode::from_decoder: `fits` first, as a header may claim gigabytes" },
    { path = "tiff::decoder::Decoder::read_image", reason = "decode::tiff_page: `fits` first, as a header may claim gigabytes" },
    { path = "std::process::Child::wait", reason = "external::output_of or a Watchdog: never wait for good" },
    { path = "std::process::Child::wait_with_output", reason = "external::output_of or a Watchdog: never wait for good" },
    { path = "egui::Ui::button", reason = "menus::button or icon_button: noted by its text, which the release tests click" },
    { path = "egui::Ui::small_button", reason = "menus::small_button: noted by its text, which the release tests click" },
    { path = "egui::Ui::selectable_label", reason = "menus::selectable: noted by its text, which the release tests click" },
    { path = "egui::Ui::selectable_value", reason = "menus::choice: noted by its text, which the release tests click" },
    { path = "egui::Ui::radio", reason = "menus::radio: noted by its text, which the release tests click" },
    { path = "egui::Ui::radio_value", reason = "menus::radio_choice: noted by its text, which the release tests click" },
    { path = "egui::Button::selectable", reason = "menus::selectable: noted by its text, which the release tests click" },
    { path = "egui::Button::new", reason = "menus::button_enabled, or a menus helper: noted by its text, which the release tests click" },
    { path = "egui::Ui::checkbox", reason = "menus::checkbox: noted by its text, which the release tests click" },
    { path = "egui::Checkbox::new", reason = "menus::checkbox: noted by its text, which the release tests click" },
    { path = "egui::RadioButton::new", reason = "menus::radio: noted by its text, which the release tests click" },
    { path = "egui::Ui::toggle_value", reason = "menus::selectable: noted by its text, which the release tests click" },
    { path = "egui::Button::image_and_text", reason = "menus::icon_button: noted by its text, which the release tests click" },
    { path = "egui::Button::opt_image_and_text", reason = "menus::icon_button: noted by its text, which the release tests click" },
    { path = "egui::Ui::link", reason = "menus::link: noted by its text, which the release tests click" },
    { path = "egui::Ui::hyperlink", reason = "menus::link with external::open_url: noted by its text, which the release tests click" },
    { path = "egui::Ui::hyperlink_to", reason = "menus::link with external::open_url: noted by its text, which the release tests click" },
    { path = "egui::Ui::menu_button", reason = "menus::submenu or scroll_menu: noted by its title, which the release tests click" },
    { path = "egui::Ui::menu_image_button", reason = "menus::submenu or scroll_menu: noted by its title, which the release tests click" },
    { path = "egui::Ui::menu_image_text_button", reason = "menus::submenu or scroll_menu: noted by its title, which the release tests click" },
    { path = "egui::containers::menu::MenuButton::new", reason = "menus::submenu or scroll_menu: noted by its title, which the release tests click" },
    { path = "egui::Link::new", reason = "menus::link: noted by its text, which the release tests click" },
    { path = "egui::Hyperlink::new", reason = "menus::link with external::open_url: noted by its text, which the release tests click" },
    { path = "egui::Hyperlink::from_label_and_url", reason = "menus::link with external::open_url: noted by its text, which the release tests click" },
    { path = "glimt::files::file_io::file_lock", reason = "file_io::edit_shared: lock, read, change and write a shared file as one" },
]
