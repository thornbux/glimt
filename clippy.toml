    # The egui entries, from egui::Ui::button to egui::widgets::reset_button_with, are every
    # public function of egui, epaint and eframe 0.37.0 (Cargo.lock) that puts text the caller
    # gives on the screen or to a screen reader, listed from their source. That is each `pub fn`
    # with a parameter of `impl Into<WidgetText>`, `Into<RichText>`, `IntoAtoms`, `Into<Atom>`,
    # `impl ToString`, `Into<String>`, `String` or `&str`, or a closure that returns a `String`,
    # used as a label, title, tooltip, hint, prefix or suffix, a number's text, alt text, an
    # accessible name, `WidgetInfo` text or a text laid out or painted; and the ways a
    # `WidgetText` or `RichText` becomes a laid out text. Left out on purpose: URIs, ids, keys,
    # texture and font names, the clipboard (`Context::copy_text`), the app id
    # (`with_app_id`, `eframe::run_native`, whose name is the title only when none is given), a
    # `custom_parser`, and a `TextEdit`'s buffer, which holds what the user types. Clippy cannot
    # refuse a field, an enum variant or an impl's `From`, so these stay with review as a class:
    # every pub field and enum variant of egui that holds text (the window title,
    # `ViewportBuilder::title`, first), and every `From` into `WidgetText`, `RichText`, `Atom`
    # or `AtomKind`. After an update of egui, list the calls again from its source (AGENTS.md,
    # "A UI text").
