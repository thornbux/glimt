# Glimt's rules for what touches the disk and starts programs, and how buttons and selectable
# rows are drawn, checked by `cargo clippy`. The one place that may do each has
# `#[allow(clippy::disallowed_methods)]` with its reason.
disallowed-methods = [
    { path = "std::fs::read", reason = "decode::read_limited: a size cap, and no pipe or device" },
    { path = "std::fs::read_to_string", reason = "decode::read_text: a size cap, and no pipe or device" },
    { path = "std::io::read_to_string", reason = "decode::read_text, or bound the reader with take" },
    { path = "std::io::Read::read_to_end", reason = "decode::read_limited, or bound the reader with take" },
    { path = "std::io::BufRead::read_line", reason = "decode::read_line_limited: a line with no break would fill the memory" },
    { path = "std::io::BufRead::read_until", reason = "decode::read_line_limited: a line with no break would fill the memory" },
    { path = "std::io::BufRead::lines", reason = "decode::read_line_limited: a line with no break would fill the memory" },
    { path = "std::io::BufRead::split", reason = "decode::read_line_limited: a part with no end would fill the memory" },
    { path = "std::io::Read::bytes", reason = "decode::read_limited or read_line_limited: a reader with no end would fill the memory" },
    { path = "std::io::copy", reason = "decode::copy_limited: into a Vec, a reader with no end would fill the memory" },
    { path = "std::fs::write", reason = "file_io::replace_name (a file of the user's), create_file (a new one) or replace_file (Glimt's own only, through a link): whole or not at all" },
    { path = "std::fs::File::create", reason = "file_io::create_file or replace_name: never through a link, never half-written; replace_file only for Glimt's own files" },
    { path = "std::fs::File::create_buffered", reason = "file_io::create_file or replace_name: never through a link, never half-written; replace_file only for Glimt's own files" },
    { path = "std::fs::File::create_new", reason = "file_io::create_file: never through a link, never half-written" },
    { path = "std::fs::OpenOptions::open", reason = "file_io's writers or decode::read_limited" },
    { path = "std::fs::rename", reason = "file_io::rename_never_over, or file_io::replace_name to replace (replace_file for Glimt's own files)" },
    { path = "std::fs::copy", reason = "file_io::put_file: never over a file, never half-copied, on disk with its name" },
    { path = "std::fs::remove_file", reason = "file_ops' jobs (delete, move) or trash::trash for a user's file; the narrowest allow with its reason for a temporary or Glimt's own file" },
    { path = "std::fs::remove_dir", reason = "trash::trash for a user's folder; the narrowest allow with its reason for Glimt's own" },
